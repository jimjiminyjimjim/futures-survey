nodeLinker: node-modules

compressionLevel: 0

# Yarn's npmMinimalAgeGate (default 1d) blocks installing package versions
# published in the last 24h as an anti-supply-chain-attack measure. The
# exact versions below were already human-verified for legitimacy
# (publisher/org, repo, download counts) in Phase 1 Plan 01 Task 1 before
# any install ran; this allowlist lets that already-approved, pinned set
# through without disabling the age gate for any other package.
npmPreapprovedPackages:
  - "next@16.4.1"
  - "eslint-config-next@16.4.1"
  - "@next/*@16.4.1"
  - "react@19.3.1"
  - "react-dom@19.3.1"
  - "react@19.3.0"
  - "react-dom@19.3.0"
  - "@supabase/supabase-js@2.117.3"
  - "@supabase/ssr@0.12.7"
  - "@base-ui/react@1.9.0"
  - "shadcn@4.21.5"
  - "@shadcn/*@*"
  - "zod@4.6.7"
  - "@playwright/test@1.64.1"
  - "playwright@1.64.1"
  - "playwright-core@1.64.1"
