<!--
  Supabase Auth "Magic Link" + "Confirm signup" templates (supabase/config.toml
  [auth.email.template.magic_link] / [auth.email.template.confirmation]).
  Pushed with `supabase config push --yes`.

  CODE ONLY: there is deliberately NO link in this email. /login/code asks for
  the typed 6-digit code (verifyOtp type "email"). Do not re-add
  {{ .ConfirmationURL }} or a {{ .TokenHash }} link.

  Code length/expiry come from config.toml [auth.email] otp_length = 6,
  otp_expiry = 900 (15 minutes). Change the copy below if those change.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Design Futures Survey sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;background-color:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:22px;font-weight:600;line-height:1.3;color:#18181b;padding-bottom:8px;">
                Your Design Futures Survey sign-in code
              </td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:22px;color:#52525b;padding-bottom:24px;">
                Enter this code on the sign-in screen to continue.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="display:inline-block;background-color:#f4f4f5;border:1px solid #e4e4e7;border-radius:12px;padding:16px 24px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#18181b;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:20px;color:#52525b;">
                The code expires in 15 minutes and can only be used once.
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:20px;color:#52525b;padding-top:16px;">
                If you didn&rsquo;t ask to sign in, you can ignore this email &mdash; nobody can get in without this code.
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e4e4e7;padding-top:24px;margin-top:24px;font-size:12px;line-height:18px;color:#a1a1aa;">
                Design Futures Survey
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
